name: Validar e distribuir

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verificar, testar e empacotar
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CLIQUE_LIMPO_BROWSER: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: python scripts/package.py
      - name: Guardar pacotes
        uses: actions/upload-artifact@v7
        with:
          name: clique-limpo-pacotes
          path: dist/*
          if-no-files-found: error
      - name: Guardar capturas e diagnosticos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clique-limpo-testes
          path: test-results/
          if-no-files-found: ignore
